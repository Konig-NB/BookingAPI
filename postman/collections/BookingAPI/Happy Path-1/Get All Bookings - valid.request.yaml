$kind: http-request
url: "{{baseUrl}}/api/bookings?page=1&pageSize=10"
method: GET
queryParams:
  page: "1"
  pageSize: "10"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response has data, totalCount, page, pageSize\", () => {\r

      \    const body = pm.response.json();\r

      \    pm.expect(body).to.have.property(\"data\");\r

      \    pm.expect(body).to.have.property(\"totalCount\");\r

      \    pm.expect(body).to.have.property(\"page\");\r

      \    pm.expect(body).to.have.property(\"pageSize\");\r

      });\r

      \r

      pm.test(\"Data is an array\", () => {\r

      \    const body = pm.response.json();\r

      \    pm.expect(body.data).to.be.an(\"array\");\r

      });"
    language: text/javascript
order: 4000
